services:
  postgres-db:
    image: postgres:16-alpine
    container_name: voltech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DevPassword123!
      POSTGRES_DB: voltech_store_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voltech_store_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: